<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peshawar's transport tracker</title>


    <!-- bootstrap link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

    <!--font awasome cdn-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .my-footer {
            margin-top: 2rem;
        }

    </style>
</head>

<body>

    <!--navbar-->

    <nav class="nav-navbar nav-lg-expand my-nav">
        <div class="nav-content">
            <div class="nav-brand">
                <i class="bi bi-bus-front-fill nav-icon"></i>
                <h5 class="nav-name">Peshawar Bus Tracker
                    <div class="nav-quote">Smarter Travel , Less Crowded , A Better Peshawar</div>
                </h5>
            </div>

            <div class="nav-links">
                <a class="nav-link" href="#Home">Home</a>
                <a class="nav-link" href="#How">How to Use</a>
                <a class="nav-link" href="#about">About</a>
            </div>

            <button class="hamburger" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <!--hero section-->

    <div class="container-fluid2">
        <img src="avai buses.png" alt="img-screen2">

        <div class="container-content2">
            <div class="breadcrumb">
                <i class="fa-solid fa-house"></i> Home &nbsp; > &nbsp; Search Results
            </div>

            <button class="back-btn"><i class="fa-solid fa-arrow-left back-btn-icon"></i>Back to Search</button>

            <h1 class="container-fluid2-heading">Available Buses</h1>
        </div>
    </div>

    <!--search summary-->

    <div class="search-summary">
        <div class="location-box">
            <div class="from-summary">
                <i class="fa-solid fa-location-dot loc-icon2"></i>
                <div><span class="route-tag">From</span><strong class="fromLocation">
                        
                    </strong>
                </div>
            </div>

            <i class="bi bi-arrow-left-right arrow-icon2"></i>

            <div class="to-summary">
                <i class="fa-solid fa-location-dot loc-icon2"></i>
                <div><span class="route-tag">To</span><strong class="toLocation">
                        
                    </strong>
                </div>
            </div>

            <span class="found-buses-num"></span>
        </div>
    </div>

    <!--available buses cards-->

    <section class="bus-section">
        <div class="bus-cards" id="busCards">

            <!--cards generated by js-->
              
        </div>
    </section>

    

    <!--FOOTER-->

    <footer class="my-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <i class="bi bi-bus-front-fill footer-icon"></i>
                <h5 class="footer-name">Peshawar Bus Tracker
                    <div class="footer-quote">Smarter Travel , Less Crowded , A Better Peshawar</div>
                </h5>
            </div>

            <div class="copyright">
                <p><i class="fa-regular fa-copyright"></i> 2026 <b>Peshawar Bus Tracker</b>. All Rights Reserved.</p>
            </div>

            <div class="follow-footer">
            <b>Follow Us</b>
            <div class="social-media">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-x-twitter"></i>
            </div>
            </div>

        </div>


    </footer>

  <script src="app.js"></script>
</body>
